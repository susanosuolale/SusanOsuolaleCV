
trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  projectPath: 'SusanOsuolaleCV.csproj'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: 'restore'
    projects: '$(projectPath)'

- task: DotNetCoreCLI@2
  displayName: 'Build SusanOsuolaleCV'
  inputs:
    command: 'build'
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --no-restore'


- task: DotNetCoreCLI@2
  displayName: 'Publish SusanOsuolaleCV'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'SusanOsuolaleCV.csproj'
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: true


- task: AzureWebApp@1
  displayName: 'Deploy SusanOsuolaleCV to Azure App Service'
  inputs:
    azureSubscription: 'SusanOsuolaleWebsiteConnection'
    appType: 'webApp'
    appName: 'SusanOsuolaleCV20261006155106'
    package: '$(Build.ArtifactStagingDirectory)/publish/**/*.zip'
